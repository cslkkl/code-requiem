# 代码安魂曲 / Code Requiem —— Streamlit 运行时与主题
#
# 视觉基调：体检报告 / 化验单。左对齐、细分隔线、等宽数字、粗字重标题。
# 没有卡片、没有药丸、没有衬线 —— 这三样是「AI 生成界面」最典型的痕迹。
#
# 圆角全部归零：编辑排版靠线条和留白组织信息，不靠圆角容器。
# 字体以 WOFF2 自托管在 assets/fonts/，运行时不请求外部 CDN。

[theme]
base = "light"
primaryColor = "#171716"            # 主按钮与链接：近黑
backgroundColor = "#F7F7F5"         # 画布：中性灰白
secondaryBackgroundColor = "#EBEBE8"
textColor = "#171716"
linkColor = "#8A3323"               # 氧化红，唯一强调色
borderColor = "#D8D8D3"
codeBackgroundColor = "#E6E6E1"
codeTextColor = "#3F3F3C"

# 正文与标题都用无衬线，靠字重与字号拉层级。
# 之前标题用中文衬线（宋体系）—— 那是 LLM 做「有文化感」界面时的默认套路，
# 在中文界面里尤其明显，读起来像 PPT 而不是工具。
font = "'Geist',system-ui,'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif"
headingFont = "'Geist',system-ui,'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif"
codeFont = "'Geist Mono','Cascadia Mono','JetBrains Mono','SF Mono','Consolas','DejaVu Sans Mono',monospace"

baseFontSize = 15
baseRadius = "0px"
buttonRadius = "0px"
showWidgetBorder = false
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#F7F7F5"
secondaryBackgroundColor = "#EBEBE8"

[server]
headless = true
fileWatcherType = "none"
maxUploadSize = 5

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = true
