# 代码安魂曲 / Code Requiem —— Streamlit 运行时与主题
#
# 视觉基调：暖白极简 / 编辑排版。纸感底色、近黑文字、极细分隔线，
# 语义色只用于状态徽章（存活 / 承压 / 已故），不做大面积上色。
# 不使用任何外部字体或 CDN —— 字体栈全部落在系统已装字体上，
# 离线与 Hugging Face Spaces（Linux）两边都能退化为系统默认可读字体。

[theme]
base = "light"
primaryColor = "#1A1A19"            # 主按钮与链接：近黑
backgroundColor = "#FBFBFA"         # 画布：暖白，不是纯白
secondaryBackgroundColor = "#F7F6F3"
textColor = "#1A1A19"
linkColor = "#8A7A5C"               # 旧铜，唯一强调色
borderColor = "#E7E6E3"
codeBackgroundColor = "#F7F6F3"
codeTextColor = "#4A4A47"

# 正文系统无衬线（长文可读）；标题与数字交给衬线与等宽做编辑感。
font = "'SF Pro Display','Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif"
headingFont = "'Lyon Text','Newsreader','Source Han Serif SC','Songti SC','Noto Serif CJK SC',Georgia,serif"
codeFont = "'SF Mono','Cascadia Mono','Consolas','DejaVu Sans Mono',ui-monospace,monospace"

baseFontSize = 16
baseRadius = "8px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#F7F6F3"
secondaryBackgroundColor = "#FFFFFF"

[server]
headless = true
fileWatcherType = "none"
maxUploadSize = 5

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = true
